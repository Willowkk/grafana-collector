[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "sdkv2-grafana-collector"
version = "0.3.0"
description = "SDKv2 Grafana historical and incremental metrics collector"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["playwright>=1.49,<2", "openpyxl>=3.1.5,<4", "pyarrow>=18,<26"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2"]

[project.scripts]
grafana-collector = "grafana_collector.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/grafana_collector"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
